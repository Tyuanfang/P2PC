name: build

on:
  push:
    branches:
      - master
      - main
      - beta
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "☕ Setup JDK 25"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
          cache: gradle

      - name: "🛂 Setup Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "🔓 Adjust script permissions"
        run: chmod +x ./gradlew

      - name: "🏗️ Build all configured version-loader pairs"
        run: ./gradlew buildAndCollect --stacktrace

      - name: "🕵️ Collect artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            build/libs/*.jar
            build/reports/**/*
