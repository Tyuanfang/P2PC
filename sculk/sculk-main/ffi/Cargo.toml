[package]
name = "sculk-ffi"
description = "UniFFI glue layer exposing the sculk core to Java (Project Panama FFM)"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lib]
name = "sculk_ffi"
crate-type = ["cdylib", "lib"]

[dependencies]
sculk = { workspace = true }
tokio = { workspace = true }
uniffi = { version = "0.32", features = ["tokio"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[lints]
workspace = true
