org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.caching.debug=false
#org.gradle.configureondemand=true

mod.id=p2pc
mod.name=P2PC
mod.version=0.0-SNAPSHOT
mod.group=a90pn.p2pc
mod.description=A Minecraft mod called P2PC.

# 网络较慢：放宽 Gradle 的 HTTP 超时（否则解析插件/依赖容易超时失败）
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=4
# 本机 DNS 对部分 maven（neoforged 等）不可用，统一走本地代理
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=15732
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=15732
systemProp.http.nonProxyHosts=localhost|127.0.0.1